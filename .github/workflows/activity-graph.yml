name: Generate Coding Activity Graph

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import datetime
          import math

          username = "vaanikpandit2825"
          token = os.environ["GH_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                commitContributionsByRepository(maxRepositories: 100) {
                  contributions(first: 100) {
                    totalCount
                    nodes {
                      occurredAt
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "coding-activity-graph"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          repositories = data["data"]["user"]["contributionsCollection"][
              "commitContributionsByRepository"
          ]

          today = datetime.date.today()
          start = today - datetime.timedelta(days=364)

          daily = {}

          for repo in repositories:
              for node in repo["contributions"]["nodes"]:
                  date = datetime.datetime.fromisoformat(
                      node["occurredAt"].replace("Z", "+00:00")
                  ).date()

                  if start <= date <= today:
                      daily[date] = daily.get(date, 0) + 1

          weeks = []

          current = start - datetime.timedelta(days=start.weekday())

          while current <= today:
              total = 0

              for i in range(7):
                  day = current + datetime.timedelta(days=i)
                  total += daily.get(day, 0)

              weeks.append((current, total))
              current += datetime.timedelta(days=7)

          width = 1000
          height = 360

          left = 70
          right = 30
          top = 55
          bottom = 55

          chart_width = width - left - right
          chart_height = height - top - bottom

          max_value = max((value for _, value in weeks), default=1)

          points = []

          for i, (_, value) in enumerate(weeks):
              x = left + (i / max(1, len(weeks) - 1)) * chart_width

              y = (
                  top
                  + chart_height
                  - (value / max_value) * chart_height
              )

              points.append((x, y, value))

          line_path = "M " + " L ".join(
              f"{x:.2f},{y:.2f}" for x, y, _ in points
          )

          area_path = (
              f"M {points[0][0]:.2f},{top + chart_height:.2f} "
              + " L "
              + " L ".join(
                  f"{x:.2f},{y:.2f}" for x, y, _ in points
              )
              + f" L {points[-1][0]:.2f},{top + chart_height:.2f} Z"
          )

          month_labels = []

          for i, (date, _) in enumerate(weeks):
              if date.day <= 7:
                  x = left + (i / max(1, len(weeks) - 1)) * chart_width
                  month_labels.append(
                      f'<text x="{x:.2f}" y="{height - 18}" '
                      f'class="label">{date.strftime("%b")}</text>'
                  )

          grid = []

          for i in range(5):
              value = round(max_value * i / 4)

              y = (
                  top
                  + chart_height
                  - (value / max_value) * chart_height
              )

              grid.append(
                  f'<line x1="{left}" y1="{y:.2f}" '
                  f'x2="{width-right}" y2="{y:.2f}" class="grid"/>'
              )

              grid.append(
                  f'<text x="{left-12}" y="{y+4:.2f}" '
                  f'text-anchor="end" class="axis">{value}</text>'
              )

          circles = []

          for x, y, value in points:
              if value > 0:
                  circles.append(
                      f'<circle cx="{x:.2f}" cy="{y:.2f}" '
                      f'r="3.2" class="point">'
                      f'<title>{value} commits</title>'
                      f'</circle>'
                  )

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}" height="{height}"
          viewBox="0 0 {width} {height}">

          <defs>
            <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#7F52FF" stop-opacity="0"/>
            </linearGradient>

            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <rect width="100%" height="100%"
                rx="18"
                fill="#0D1117"/>

          <text x="{left}" y="30"
                class="title">
            Coding Activity
          </text>

          <text x="{width-right}" y="30"
                text-anchor="end"
                class="subtitle">
            Weekly commits · Last 12 months
          </text>

          {''.join(grid)}

          <path d="{area_path}"
                fill="url(#area)"/>

          <path d="{line_path}"
                fill="none"
                stroke="#7F52FF"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                filter="url(#glow)"/>

          {''.join(circles)}

          {''.join(month_labels)}

          <style>
            .title {{
              fill: #38FDD8;
              font-family: Arial, sans-serif;
              font-size: 20px;
              font-weight: 700;
            }}

            .subtitle {{
              fill: #8B949E;
              font-family: Arial, sans-serif;
              font-size: 13px;
            }}

            .label {{
              fill: #8B949E;
              font-family: Arial, sans-serif;
              font-size: 12px;
            }}

            .axis {{
              fill: #6E7681;
              font-family: Arial, sans-serif;
              font-size: 10px;
            }}

            .grid {{
              stroke: #21262D;
              stroke-width: 1;
            }}

            .point {{
              fill: #38FDD8;
              stroke: #0D1117;
              stroke-width: 1.5;
            }}
          </style>

          </svg>
          """

          os.makedirs("generated", exist_ok=True)

          with open("generated/activity-graph.svg", "w") as f:
              f.write(svg)

          print("Generated activity graph successfully.")
          PY

      - name: Publish graph
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./generated
          keep_files: true
